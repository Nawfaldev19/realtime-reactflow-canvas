"""
How a version was made
"""
enum VersionKindEnum {
  """
  Taken every 10 minutes of editing, when something changed
  """
  AUTOMATIC

  """
  The first version of a new diagram or a copy
  """
  CREATED

  """
  Saved by a member, optionally with a label
  """
  MANUAL

  """
  The diagram as it was just before a restore
  """
  RESTORE
}

"""
One page of a diagram's versions, newest first
"""
type VersionPage {
  """
  Pass as `after` to load the next page; null on the last page
  """
  endCursor: String
  hasNextPage: Boolean!
  nodes: [DiagramVersion!]!
  totalCount: Int!
}

