"""
A diagram. `document` and `viewSettings` are only loaded when requested.
"""
type Diagram {
  canEdit: Boolean!

  """
  Live collaboration: edits go through the operation channel, not saveDiagram
  """
  collaborationEnabled: Boolean!
  createdAt: ISO8601DateTime!

  """
  Version-1 document: nodes, edges, nextNumber
  """
  document: JSON!
  edgeCount: Int!
  id: ID!
  nodeCount: Int!

  """
  Increments on every accepted save or collaborative operation (the room sequence number)
  """
  revision: Int!
  title: String!
  updatedAt: ISO8601DateTime!
  updatedBy: Member

  """
  Saved versions, newest first. Anyone who can open the diagram may list them.
  """
  versions(
    """
    The `endCursor` of the previous page
    """
    after: String

    """
    Page size, 1 to 50
    """
    first: Int = 20
  ): VersionPage!
  viewSettings: JSON!
  workspace: Workspace!
}

"""
An immutable snapshot of a diagram. `document` and `viewSettings` are only loaded when requested.
"""
